name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build game
        run: bash build.sh && cp game.html index.html
      - name: Build APK
        run: |
          cp index.html android/app/src/main/assets/index.html
          cd android && gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MoxieEmber.apk
      - name: Build web (home screen) package
        run: |
          mkdir site && cp index.html site/ && cp web/* site/
          sed -i 's#</head>#<link rel="manifest" href="manifest.webmanifest"></head>#' site/index.html
          cd site && zip -r ../MoxieEmber-web.zip .
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            MoxieEmber.apk
            MoxieEmber-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MoxieEmber
          path: |
            MoxieEmber.apk
            MoxieEmber-web.zip
