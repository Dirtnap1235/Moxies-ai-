<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moxie Ember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d6ea;--ink:#2a2742;--sh1:#8a7de0;--sh2:#6556c8;--sh3:#4638a0;--bz:#23222f;--bt:#34324a;--bt2:#4c4a6a;--ab:#b83a58;--cu:44px;--px:3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121c;--ink:#d8d4f0}}
:root[data-theme="dark"]{--bg:#13121c;--ink:#d8d4f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.gba{display:grid;align-items:center;justify-items:center;gap:calc(var(--cu)*.25) calc(var(--cu)*.6);padding:calc(var(--cu)*.5) calc(var(--cu)*.8) calc(var(--cu)*.7);background:linear-gradient(165deg,var(--sh1),var(--sh2) 45%,var(--sh3));border-radius:calc(var(--cu)*.5) calc(var(--cu)*.5) calc(var(--cu)*1.6) calc(var(--cu)*1.6);box-shadow:inset 0 2px 0 #ffffff55,inset 0 -3px 0 #00000040,0 10px 30px #0007;grid-template-areas:"d s a" ". t .";grid-template-columns:auto auto auto}
.bezel{grid-area:s;background:var(--bz);padding:calc(var(--cu)*.4) calc(var(--cu)*.5) calc(var(--cu)*.2);border-radius:calc(var(--cu)*.3) calc(var(--cu)*.3) calc(var(--cu)*.8) calc(var(--cu)*.3);text-align:center}
.lens{position:relative;background:#000;padding:calc(var(--px)*1px);border:2px solid #0a0a10;line-height:0}
.lens::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#0000001c 1px,#0000 1px),linear-gradient(90deg,#0000001c 1px,#0000 1px);background-size:calc(var(--px)*1px) calc(var(--px)*1px);opacity:.7}
canvas{width:calc(240px*var(--px));height:calc(160px*var(--px));image-rendering:crisp-edges;image-rendering:pixelated;display:block;background:#000}
.brand{font:700 calc(var(--cu)*.26)/1 system-ui,sans-serif;letter-spacing:.3em;color:#8f8bb0;margin-top:calc(var(--cu)*.2)}
.dpad{grid-area:d;display:grid;grid-template:repeat(3,var(--cu))/repeat(3,var(--cu))}
.dpad button,.dpad i{background:var(--bt);border:0;padding:0;box-shadow:0 3px 0 #0006,inset 0 2px 0 #ffffff22}
.dpad i{grid-area:2/2;box-shadow:none}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.ab{grid-area:a;position:relative;width:calc(var(--cu)*3);height:calc(var(--cu)*2.6)}
.ab button{position:absolute;width:calc(var(--cu)*1.4);height:calc(var(--cu)*1.4);border-radius:50%;border:0;background:var(--ab);color:#f4d0da;font:700 calc(var(--cu)*.4) system-ui;box-shadow:0 4px 0 #0005,inset 0 3px 0 #ffffff44}
.ab .a{right:0;top:0}.ab .b{left:0;bottom:0}
.ss{grid-area:t;display:flex;gap:calc(var(--cu)*.9)}
.ss button{border:0;background:var(--bt2);color:#c8c4e8;font:700 calc(var(--cu)*.22) system-ui;letter-spacing:.12em;padding:calc(var(--cu)*.2) calc(var(--cu)*.55);border-radius:99px;transform:rotate(-18deg);box-shadow:0 2px 0 #0005}
button.on{filter:brightness(.75)}
@media (max-aspect-ratio:1/1){.gba{grid-template-areas:"s s" "d a" "t t";grid-template-columns:1fr 1fr;gap:calc(var(--cu)*.4) calc(var(--cu)*.2);padding:calc(var(--cu)*.4) calc(var(--cu)*.5) calc(var(--cu)*.6)}.dpad{justify-self:start}.ab{justify-self:end}}
</style>
</head>
<body>
<div class="gba" id="gba">
 <div class="dpad"><button data-k="up" class="u" aria-label="Up"></button><button data-k="left" class="l" aria-label="Left"></button><i></i><button data-k="right" class="r" aria-label="Right"></button><button data-k="down" class="d" aria-label="Down"></button></div>
 <div class="bezel"><div class="lens"><canvas id="screen" width="240" height="160"></canvas></div><div class="brand">MX ADVANCE</div></div>
 <div class="ab"><button data-k="b" class="b" aria-label="B">B</button><button data-k="a" class="a" aria-label="A">A</button></div>
 <div class="ss"><button data-k="select">SELECT</button><button data-k="start">START</button></div>
</div>
<script>
